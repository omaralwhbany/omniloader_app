name: Build Release APK

on:
  push:
    branches: [ main, feature/localization-refactor ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Generate Android Scaffolding & Configure Settings
        run: |
          flutter create --platforms=android --org com.omniloader.app .

          sed -i 's/android:label="omniloader_app"/android:label="تنزيل الفيديو"/' android/app/src/main/AndroidManifest.xml

          sed -i '/<application/i \
              <uses-permission android:name="android.permission.INTERNET"/>\
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\
              <uses-permission android:name="android.permission.WAKE_LOCK"/>\
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>' android/app/src/main/AndroidManifest.xml

          python3 <<'PY'
          import re

          path = 'android/app/build.gradle'

          with open(path, 'r') as f:
              c = f.read()

          c = c.replace(
              'compileSdk = flutter.compileSdkVersion',
              'compileSdk = 34'
          )

          c = c.replace(
              'minSdk = flutter.minSdkVersion',
              'minSdk = 21'
          )

          c = c.replace(
              'minSdkVersion flutter.minSdkVersion',
              'minSdkVersion 21'
          )

          if 'multiDexEnabled' not in c:
              c = c.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        multiDexEnabled true',
                  1
              )

          if 'coreLibraryDesugaringEnabled' not in c:
              c = c.replace(
                  'compileOptions {',
                  'compileOptions {\n        coreLibraryDesugaringEnabled true',
                  1
              )

          if 'coreLibraryDesugaring ' not in c:
              dependency = """
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          """

              if re.search(r'^\s*dependencies\s*\{', c, re.M):
                  c = re.sub(
                      r'(^\s*dependencies\s*\{)',
                      r"\1\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                      c,
                      count=1,
                      flags=re.M
                  )
              else:
                  c += '\n' + dependency

          with open(path, 'w') as f:
              f.write(c)

          print("Gradle configuration completed.")
          print("Core library desugaring dependency verified.")
          PY

          echo "========== GRADLE CONFIGURATION =========="
          cat android/app/build.gradle

          # Generate valid Android PNG launcher icons
          python3 -m pip install --break-system-packages Pillow

          python3 <<'PYICON'
          from PIL import Image
          import os

          image = Image.open("assets/logo.png").convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)

              icon = image.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  f"{path}/ic_launcher.png",
                  format="PNG"
              )

          print("All Android icons generated successfully.")
          PYICON

      - name: Restore bundled offline font
        run: |
          base64 --decode assets/fonts/ArefRuqaa-Regular.ttf.base64 > assets/fonts/ArefRuqaa-Regular.ttf
          test -s assets/fonts/ArefRuqaa-Regular.ttf

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
