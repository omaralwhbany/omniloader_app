name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Ensure Logo Exists
        run: |
          mkdir -p assets
          if [ ! -f assets/logo.png ] || [ ! -s assets/logo.png ]; then
            python3 -c "
            import zlib, struct
            w, h = 512, 512
            raw = bytearray()
            for y in range(h):
                raw.append(0)
                for x in range(w):
                    dx, dy = x - 256, y - 256
                    d2 = dx*dx + dy*dy
                    if 230*230 <= d2 <= 248*248:
                        raw.extend([56, 189, 248, 255])
                    elif d2 < 230*230:
                        raw.extend([14, 34, 56, 255])
                    else:
                        raw.extend([15, 23, 42, 255])
            compressed = zlib.compress(bytes(raw), level=9)
            def chunk(tag, data):
                return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
            png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', compressed) + chunk(b'IEND', b'')
            with open('assets/logo.png', 'wb') as f:
                f.write(png)
            "
          fi

      - name: Generate Android Scaffolding & Configure Settings
        run: |
          flutter create --platforms=android --org com.omniloader.app .

          sed -i 's/android:label="omniloader_app"/android:label="تنزيل الفيديو"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>' android/app/src/main/AndroidManifest.xml

          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              c = f.read()

          c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
          c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')

          if 'multiDexEnabled' not in c:
              c = c.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')

          if 'compileOptions {' in c:
              c = c.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')

          if 'dependencies {' in c:
              c = c.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"')

          with open(path, 'w') as f:
              f.write(c)
          "

          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp -f assets/logo.png "$dir/ic_launcher.png" || true
            fi
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
