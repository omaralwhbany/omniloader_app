name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate High-Res Logo Asset
        run: |
          mkdir -p assets
          python3 -c "
          import zlib, struct, os

          width, height = 512, 512
          raw_data = bytearray()

          # تلوين بكسلات الشعار (خلفية كحلية مع حلقة سماوية وسهم تنزيل)
          for y in range(height):
              raw_data.append(0)  # Filter byte per scanline
              for x in range(width):
                  dx = x - 256
                  dy = y - 256
                  dist_sq = dx*dx + dy*dy

                  # الإطار الدائري الخارجي
                  if 230*230 <= dist_sq <= 248*248:
                      raw_data.extend([56, 189, 248, 255])
                  # الدائرة الداخلية
                  elif dist_sq < 230*230:
                      # رسم رأس السهم والعمود
                      in_stem = (abs(dx) <= 24 and -100 <= dy <= 60)
                      in_head = (dy > 60 and dy <= 140 and abs(dx) <= (140 - dy) * 1.3)
                      in_base = (160 <= dy <= 180 and abs(dx) <= 90)

                      if in_stem or in_head or in_base:
                          raw_data.extend([56, 189, 248, 255])
                      else:
                          raw_data.extend([14, 34, 56, 255])
                  else:
                      raw_data.extend([15, 23, 42, 255])

          compressed = zlib.compress(bytes(raw_data), level=9)

          def chunk(tag, data):
              return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', compressed)
          png += chunk(b'IEND', b'')

          with open('assets/logo.png', 'wb') as f:
              f.write(png)
          print('Assets logo generated successfully with built-in modules.')
          "

      - name: Generate Android Scaffolding & Permissions
        run: |
          flutter create --platforms=android --org com.omniloader.app .
          sed -i 's/android:label="omniloader_app"/android:label="تنزيل الفيديو"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>' android/app/src/main/AndroidManifest.xml

          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle
          sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle
          sed -i '/android {/a \    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }' android/app/build.gradle
          sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' android/app/build.gradle

      - name: Install Dependencies & Build Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
