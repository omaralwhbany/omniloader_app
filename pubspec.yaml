name: omniloader_app
description: "تطبيق تنزيل الفيديو بالخلفية بخط الثلث"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  youtube_explode_dart: ^2.2.1
  dio: ^5.4.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
